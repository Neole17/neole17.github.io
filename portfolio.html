<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;800&family=Orbitron:wght@700;900&family=Noto+Sans+SC:wght@500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Albert Sans', sans-serif; color: #111; background: #f4f5f6; }

    :root { --blue: #1c4dff; --sky: #2f8cff; --paper: #f4f5f6; --ink: #111; }

    #root { display: flex; width: 100vw; height: 100vh; }

    .dots {
      background-color: var(--paper);
      background-image: radial-gradient(circle, rgba(0, 0, 0, 0.22) 1px, transparent 1.2px);
      background-size: 26px 26px;
    }

    #sidebar {
      position: relative; z-index: 30; flex-shrink: 0; width: 56px; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 48px 0 16px; background: #f7f8fa; border-right: 2px solid var(--ink);
    }
    .years { display: flex; flex-direction: column; }
    .year-tab {
      writing-mode: vertical-rl; transform: rotate(180deg);
      width: 100%; padding: 20px 0; border: none; border-left: 4px solid transparent; background: transparent; cursor: pointer;
      font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 900; letter-spacing: 4px; color: #111;
      transition: background 0.15s, color 0.15s;
    }
    .year-tab:hover { background: #e4e8f5; }
    .year-tab.active { background: var(--blue); color: #fff; border-left-color: #111; }
    .side-nav { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .side-link {
      writing-mode: vertical-rl; transform: rotate(180deg);
      padding: 12px 0; width: 100%; text-align: center; text-decoration: none;
      font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 3px; color: #111;
      transition: background 0.15s, color 0.15s;
    }
    .side-link:hover { background: #111; color: #fff; }
    .side-link.active { color: var(--blue); cursor: default; }
    .side-link.active:hover { background: transparent; }

    #stage { position: relative; flex: 1; min-width: 0; overflow: hidden; }
    #fan { position: absolute; left: 0; top: 0; width: 60%; height: 100%; pointer-events: none; }
    #hud { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #hud .h { stroke: #111; stroke-width: 1; }
    #hud .hf { stroke: #111; stroke-width: 1; opacity: 0.25; }
    #hud .bar { fill: #111; }
    #hud text { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; fill: #222; }
    #hud .blink { animation: blink 2.6s steps(2, jump-none) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }
    .hairline { position: absolute; left: calc((100% - min(500px, 30vw)) * 0.6); top: 0; bottom: 0; width: 1px; background: rgba(0, 0, 0, 0.18); }


    #track { position: absolute; left: 0; right: 0; top: 52%; height: min(64vh, 600px); transform: translateY(-50%); z-index: 4; touch-action: pan-y; }
    .card { position: absolute; top: 0; height: 100%; overflow: hidden; cursor: pointer; background: #dfe3ea; }
    .card img { position: absolute; top: 0; left: 50%; height: 100%; width: auto; max-width: none; transform: translateX(-50%); display: block; pointer-events: none; user-select: none; }
    .card.current { cursor: zoom-in; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.16); }
    #bracket { position: absolute; z-index: 6; width: 90px; height: 200px; border-left: 6px solid var(--blue); border-top: 6px solid var(--blue); pointer-events: none; }


    #next {
      position: absolute; left: calc((100% - min(500px, 30vw)) * 0.6); bottom: 36px; transform: translateX(40px);
      display: flex; align-items: center; gap: 12px; border: none; background: none; cursor: pointer;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #222;
    }
    #next i { display: block; width: 34px; height: 1px; background: #111; position: relative; transition: width 0.2s; }
    #next i::after { content: ''; position: absolute; right: 0; top: -3px; width: 7px; height: 7px; border-top: 1px solid #111; border-right: 1px solid #111; transform: rotate(45deg); }
    #next:hover i { width: 52px; }
    #index { position: absolute; left: calc((100% - min(500px, 30vw)) * 0.6); bottom: 36px; transform: translateX(calc(-100% - 24px)); white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #222; }
    #index b { color: var(--blue); }
    #index span { margin-left: 14px; color: #555; }

    #panel {
      position: absolute; right: 0; top: 0; bottom: 0; width: min(500px, 30vw); z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, #6fd2ff 0%, #3b8dff 35%, #1c4dff 70%, #0b2bc4 100%);
    }
    .hanzi { position: absolute; right: 0; top: 0; bottom: 0; width: min(500px, 30vw); z-index: 2; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 0 6px 10px; pointer-events: none; }
    .hanzi span { display: block; white-space: nowrap; font-family: 'Noto Sans SC', sans-serif; font-weight: 500; line-height: 1; letter-spacing: -0.02em; color: rgba(255, 255, 255, 0.22); }


    #lightbox { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(244, 245, 246, 0.97); cursor: zoom-out; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 88vw; max-height: 86vh; object-fit: contain; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18); }
    #lightbox::before { content: ''; position: absolute; left: 32px; top: 32px; width: 90px; height: 90px; border-left: 6px solid var(--blue); border-top: 6px solid var(--blue); }
    .lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 54px; height: 54px; border: 2px solid #111; background: #fff; font-size: 30px; line-height: 1; cursor: pointer; }
    .lb-arrow:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
    #lb-prev { left: 28px; }
    #lb-next { right: 28px; }
    #lightbox p { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #333; }

    @media (max-width: 900px) {
      html, body { overflow: auto; }
      #root { flex-direction: column; height: auto; min-height: 100vh; }
      #sidebar { width: 100%; height: auto; flex-direction: row; align-items: center; padding: 14px 16px; border-right: none; border-bottom: 3px solid var(--ink); gap: 14px; }
      .years, .side-nav { flex-direction: row; width: auto; }
      .year-tab, .side-link { writing-mode: horizontal-tb; transform: none; width: auto; padding: 10px 12px; border-left: none; border-bottom: 4px solid transparent; }
      .year-tab.active { border-bottom-color: #111; }
      #stage { height: 86vh; }
      #fan { width: 100%; }
      #track { height: 46vh; }
      #next, #index { left: 50%; }
      .hairline { left: 50%; }
      #panel, .hanzi { width: 40vw; }
    }
    @media (prefers-reduced-motion: reduce) {
      #hud .blink { animation: none; }
    }
  </style>
</head>
<body>
<div id="root">

  <aside id="sidebar">
    <nav class="years" id="years" aria-label="Years"></nav>
    <nav class="side-nav" aria-label="Pages">
      <a class="side-link" href="./index.html">HOME</a>
      <a class="side-link" href="./about.html">ABOUT</a>
      <a class="side-link active" aria-current="page">PORTFOLIO</a>
      <a class="side-link" href="./contact.html">CONTACT</a>
    </nav>
  </aside>

  <main id="stage" class="dots">
    <div id="panel" aria-hidden="true"></div>
    <canvas id="fan" aria-hidden="true"></canvas>


    <svg id="hud" aria-hidden="true"></svg>
    <div class="hairline" aria-hidden="true"></div>

    <div id="track" role="list" aria-label="Works"></div>
    <div id="bracket" aria-hidden="true"></div>

    <div class="hanzi" id="hanzi" aria-hidden="true">
      <span>桃李不言</span><span>桃李不言</span><span>桃李不言</span>
      <span>桃李不言</span><span>桃李不言</span><span>桃李不言</span>
    </div>

    <div id="index"></div>
    <button id="next" aria-label="Next work">NEXT <i></i></button>
  </main>

</div>

<div id="lightbox" role="dialog" aria-label="Full size image"><button class="lb-arrow" id="lb-prev" aria-label="Previous image">‹</button><img id="lb-img" alt=""><button class="lb-arrow" id="lb-next" aria-label="Next image">›</button><p id="lb-cap"></p></div>

<script type="module">
  const P = './assets/images/portfolio/';
  const WORKS = {
    2026: [
      ['Subsurface', 'Environment Concept', ['2026/subsurface-magma final.png']],
      ['Game Shot UI', 'Game Design Concept, UI Shot', ['2026/Game Shot UI.png']],
      ['Fish Pencil', 'Seafood Market, China', ['2026/fish_pencil.jpg']],
      ['Venice', 'Watercolour', ['2026/Venice.jpg']],
      ['Dragon Break-in', 'Unfinished Environmental Concept', ['2026/dragon.png']],
      ['Machine Doll', 'Character Concept', ['2026/hydraulics-robot-guard.jpg']],
      ['Witch Bones', 'Character Design', ['2026/T2 final render 1.png']],
      ['Mirror Door', 'Blender 3D Environment Concept', ['2026/mirror door 1.png']],
      ['Energy Plant', 'Environment Concept', ['2026/energy plant v2.png']],
      ['Environmental Sketch', 'Concept Art', ['2026/Environmental sketch.png']],
      ['VISCOM Term 3', 'Environmental Art Practice', ['2026/VISCOM Term3 Week 1.png']],
      ['Hard Machinery', 'Industrial Sketches', ['2026/hard machinery sketch.png']],
      ['Frankenstein', 'Concept Storyboard, Mary Shelley', ['2026/frankenstein.jpg']],
      ['Assemblage', 'Mixed Media', ['2026/assemblage00.jpeg', '2026/assemblage01.jpeg', '2026/assemblage02.jpeg']],
      ['Watchmaker', 'Character Concept', ['2026/Watchmaker part 2.png']],
    ],
    2025: [
      ['Crow', 'Illustration', ['2025/crow.jpeg']],
      ['Dove, Charity', 'Illustration', ['2025/dove_02.jpg']],
      ['Camera Shots', 'VISCOM Exercise', ['2025/VISCOM Week3 In-Class (2).png']],
      ['Movie Compositions', 'VISCOM Exercise', ['2025/viscom W1 movie comp 3.png']],
      ['Value Study', 'VISCOM Black and White Value Study', ['2025/bw 2.png']],
      ['Airplane', 'VISCOM Week 8', ['2025/Week8 airplane.png']],
      ['Enchanted Forest', 'Winter Formal Poster', ['2025/WF_enchanted_forest.png']],
      ['Glucose Molecule', '3D Render', ['2025/C6H12O6 - H2O IMF.png']],
    ],
    2024: [
      ['River', 'Acrylic', ['2024/river.jpeg']],
      ['White Rock', 'Acrylic', ['2024/white_rock.jpeg']],
    ],
  };

  const data = {};
  for (const [year, list] of Object.entries(WORKS)) {
    data[year] = list.map(([title, sub, files]) => {
      const images = files.map((f) => P + f);
      return { title, sub, year, images, src: images[0], aspect: 0.75 };
    });
  }
  const years = Object.keys(data).sort((a, b) => b - a);
  const $ = (id) => document.getElementById(id);
  let year = years[0], idx = 0;

  function renderYears() {
    $('years').innerHTML = '';
    for (const y of years) {
      const btn = document.createElement('button');
      btn.className = 'year-tab' + (y === year ? ' active' : '');
      btn.textContent = y;
      btn.onclick = () => { if (y !== year) { year = y; idx = 0; renderYears(); buildTrack(); show(); } };
      $('years').append(btn);
    }
  }

  const NARROW = 160, GAP = 14, AIR = 100;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pos = 0, target = 0, cards = [], snapTimer = 0;

  function buildTrack() {
    const track = $('track');
    track.innerHTML = '';
    cards = data[year].map((w, i) => {
      const c = document.createElement('div');
      c.className = 'card';
      c.setAttribute('role', 'listitem');
      c.title = w.title;
      c.innerHTML = `<img alt="" draggable="false" decoding="async">`;
      const img = c.firstChild;
      img.alt = w.title;
      img.onload = () => { if (img.naturalHeight) { w.aspect = img.naturalWidth / img.naturalHeight; layout(); } };
      img.src = w.src;
      c.onclick = () => {
        if (i === idx && Math.abs(pos - i) < 0.05) openLightbox();
        else goTo(i);
      };
      track.append(c);
      return c;
    });
    pos = target = 0;
    layout();
  }

  function layout() {
    const track = $('track'), H = track.clientHeight, W = $('stage').clientWidth;
    const anchorX = (W - $('panel').clientWidth) * 0.6;
    const list = data[year];
    const weight = list.map((w, i) => {
      const d = Math.min(1, Math.abs(i - pos));
      return 1 - d * d * (3 - 2 * d);
    });
    const widths = list.map((w, i) => NARROW + Math.max(0, H * w.aspect - NARROW) * weight[i]);
    const centres = [];
    let x = 0;
    widths.forEach((wd, i) => {
      x += AIR * weight[i];
      centres.push(x + wd / 2);
      x += wd + AIR * weight[i] + GAP;
    });
    const lo = Math.floor(pos), hi = Math.min(list.length - 1, lo + 1), f = pos - lo;
    const anchor = centres[lo] + (centres[hi] - centres[lo]) * f;
    const shift = anchorX - anchor;
    cards.forEach((c, i) => {
      c.style.width = widths[i] + 'px';
      c.style.left = (centres[i] - widths[i] / 2 + shift) + 'px';
      c.classList.toggle('current', i === idx);
    });
    const cur = cards[idx];
    if (cur) {
      const br = $('bracket'), tr = track.getBoundingClientRect(), st = $('stage').getBoundingClientRect();
      br.style.left = (parseFloat(cur.style.left) - 20) + 'px';
      br.style.top = (tr.top - st.top - 20) + 'px';
    }
  }

  function setIdx(i) {
    if (i === idx) return;
    idx = i;
    show();
  }

  function show() {
    const list = data[year], w = list[idx];
    $('index').innerHTML = `<b>${String(idx + 1).padStart(2, '0')}</b> / ${String(list.length).padStart(2, '0')}<span>${w.title} · ${w.sub}</span>`;
  }

  function goTo(i) {
    const n = data[year].length;
    target = Math.max(0, Math.min(n - 1, i));
    setIdx(Math.round(target));
    if (still) { pos = target; layout(); }
  }

  function tick() {
    const d = target - pos;
    pos = Math.abs(d) < 0.001 ? target : pos + d * 0.14;
    setIdx(Math.round(pos));
    layout();
    requestAnimationFrame(tick);
  }

  $('stage').addEventListener('wheel', (e) => {
    e.preventDefault();
    const n = data[year].length;
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    target = Math.max(0, Math.min(n - 1, target + delta * 0.004));
    setIdx(Math.round(target));
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => { target = Math.round(target); }, 160);
    if (still) { pos = Math.round(target); layout(); }
  }, { passive: false });

  let drag = null;
  $('track').addEventListener('pointerdown', (e) => { drag = { x: e.clientX, t: target, moved: false }; });
  addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (Math.abs(dx) > 6) drag.moved = true;
    const n = data[year].length;
    target = Math.max(0, Math.min(n - 1, drag.t - dx / 140));
    setIdx(Math.round(target));
  });
  addEventListener('pointerup', () => {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    target = Math.round(target);
    if (moved) { const c = (e) => { e.stopPropagation(); removeEventListener('click', c, true); }; addEventListener('click', c, true); setTimeout(() => removeEventListener('click', c, true), 0); }
  });
  new ResizeObserver(() => layout()).observe($('stage'));

  let lbIndex = 0;
  function lbShow() {
    const w = data[year][idx], n = w.images.length;
    $('lb-img').src = w.images[lbIndex];
    $('lb-cap').textContent = `${w.title} · ${w.sub} · ${w.year}` + (n > 1 ? ` · ${lbIndex + 1} / ${n}` : '');
    $('lb-prev').hidden = $('lb-next').hidden = n < 2;
  }
  function openLightbox() {
    lbIndex = 0;
    lbShow();
    $('lightbox').classList.add('open');
  }
  const lbStep = (d) => { const n = data[year][idx].images.length; lbIndex = (lbIndex + d + n) % n; lbShow(); };
  $('lb-prev').onclick = (e) => { e.stopPropagation(); lbStep(-1); };
  $('lb-next').onclick = (e) => { e.stopPropagation(); lbStep(1); };

  const step = (d) => { const n = data[year].length; goTo((Math.round(target) + d + n) % n); };
  $('next').onclick = () => step(1);
  $('lightbox').onclick = () => $('lightbox').classList.remove('open');
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('lightbox').classList.remove('open');
    const lb = $('lightbox').classList.contains('open');
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') lb ? lbStep(1) : step(1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') lb ? lbStep(-1) : step(-1);
  });

  function fitHanzi() {
    const panel = $('hanzi'), rows = panel.children;
    const h = panel.clientHeight - 12, w = panel.clientWidth - 14;
    const size = Math.min(h / 6, w / 4.1);
    for (const r of rows) r.style.fontSize = size + 'px';
  }
  new ResizeObserver(fitHanzi).observe($('hanzi'));
  fitHanzi();

  function buildHud() {
    const NS = 'http://www.w3.org/2000/svg', hud = $('hud');
    const W = hud.clientWidth, H = hud.clientHeight;
    hud.innerHTML = '';
    const add = (tag, a) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); hud.append(n); return n; };
    let s = 31;
    const r = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
    for (const y of [0.08, 0.11, 0.2, 0.66, 0.84, 0.93]) {
      const x = r() * W * 0.6, len = 120 + r() * W * 0.4;
      add('line', { class: 'h', x1: x, y1: H * y, x2: x + len, y2: H * y });
      add('line', { class: 'h', x1: x + len * 0.2, y1: H * y - 4, x2: x + len * 0.2, y2: H * y + 4 });
    }
    for (let i = 0; i < 9; i++) {
      const y = r() * H, x = r() * W;
      add('line', { class: 'hf', x1: x, y1: y, x2: Math.min(W, x + 80 + r() * 360), y2: y });
      add('line', { class: 'hf', x1: x, y1: y, x2: x, y2: y + 20 + r() * 80 });
    }
    add('rect', { class: 'bar', x: 0, y: H * 0.55, width: W * 0.26, height: 22 });
    add('rect', { class: 'bar', x: W * 0.3, y: H * 0.55 + 6, width: 60, height: 8 });
    add('rect', { class: 'bar', x: 18, y: H * 0.47, width: 140, height: 5 });
    add('rect', { class: 'bar', x: 18, y: H * 0.47 + 10, width: 70, height: 3 });
    add('rect', { class: 'bar blink', x: W * 0.36, y: H * 0.08 - 8, width: 34, height: 4 });
    add('rect', { class: 'bar', x: 6, y: H * 0.12, width: 3, height: H * 0.18 });
    add('rect', { class: 'bar', x: 6, y: H * 0.7, width: 3, height: H * 0.22 });
    const notes = [
      [W * 0.62, H * 0.06, 'NEOLE / PORTFOLIO INDEX'],
      [W * 0.62, H * 0.06 + 12, 'SELECTED WORK, 2024–2026'],
      [W * 0.62, H * 0.06 + 24, 'ILLUSTRATION · CONCEPT · 3D'],
      [W * 0.04, H * 0.53, 'SEQ_A / 01'],
      [W * 0.82, H * 0.9, 'COORD 49.28N 123.12W'],
      [W * 0.04, H * 0.97, '— ‖ ‖ —— ▸'],
    ];
    for (const [x, y, t] of notes) { const n = add('text', { x, y }); n.textContent = t; }
    for (let i = 0; i < 14; i++) add('rect', { class: 'bar', x: W * 0.02 + i * 6, y: H * 0.9, width: 3, height: 3 });
  }
  new ResizeObserver(buildHud).observe($('stage'));

  (function fan() {
    const cv = $('fan'), ctx = cv.getContext('2d');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w = 0, h = 0, dpr = 1;
    let s = 77;
    const r = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
    const rays = Array.from({ length: 15 }, () => ({ a: r() * Math.PI * 2, len: 0.25 + r() * 1.1, w: r() < 0.12 ? 2.2 : 0.7, o: 0.15 + r() * 0.6 }));
    const resize = () => {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = cv.clientWidth; h = cv.clientHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      if (still) draw(0);
    };
    function glowStroke(alpha, width) {
      ctx.lineWidth = width * 5; ctx.strokeStyle = `rgba(30,122,214,${alpha * 0.07})`; ctx.stroke();
      ctx.lineWidth = width; ctx.strokeStyle = `rgba(30,122,214,${alpha * 0.6})`; ctx.stroke();
    }
    function draw(t) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const hub = { x: w * 0.26, y: h * 0.46 };
      const near = { x: -w * 0.15, y: h * 1.05 };
      const R = Math.hypot(w, h);
      ctx.lineCap = 'round';
      for (const ray of rays) {
        const a = ray.a + Math.sin(t * 0.05) * 0.03;
        ctx.beginPath();
        ctx.moveTo(hub.x + Math.cos(a) * 14, hub.y + Math.sin(a) * 14);
        ctx.lineTo(hub.x + Math.cos(a) * R * ray.len * 0.6, hub.y + Math.sin(a) * R * ray.len * 0.6);
        glowStroke(ray.o * 0.55, ray.w);
      }
      const N = 11, flow = (t * 0.08) % 1;
      for (let i = 0; i < N; i++) {
        const k = (i + flow) / N;
        const e = Math.pow(k, 2.2);
        const cx = hub.x + (near.x - hub.x) * e, cy = hub.y + (near.y - hub.y) * e;
        const rad = 6 + e * R * 0.62;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rad, rad * 0.94, -0.5, 0, Math.PI * 2);
        const fade = Math.min(1, k * 4) * (1 - k * 0.35);
        glowStroke(0.5 * fade, i % 4 === 0 ? 2.2 : 1);
      }
      for (const [rx, ry, rot, a0, a1, wd] of [[0.9, 0.62, -0.6, 2.2, 4.4, 4], [1.25, 0.8, -0.4, 2.5, 4.0, 2], [0.62, 0.5, -0.7, 1.9, 4.6, 3]]) {
        ctx.beginPath();
        ctx.ellipse(hub.x - w * 0.18, hub.y + h * 0.12, w * rx, h * ry, rot + Math.sin(t * 0.07) * 0.03, a0, a1);
        glowStroke(0.6, wd);
      }
      for (const rr of [10, 18, 26]) {
        ctx.beginPath(); ctx.arc(hub.x, hub.y, rr, 0, Math.PI * 2); glowStroke(0.8, rr === 10 ? 3 : 1.2);
      }
      ctx.beginPath(); ctx.arc(hub.x, hub.y, 5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(30,122,214,0.8)'; ctx.fill();
    }
    const loop = (now) => { draw(now / 1000); requestAnimationFrame(loop); };
    new ResizeObserver(resize).observe(cv);
    resize();
    if (!still) requestAnimationFrame(loop);
  })();


  renderYears();
  buildTrack();
  show();
  requestAnimationFrame(tick);
</script>
</body>
</html>
