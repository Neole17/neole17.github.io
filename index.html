<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Orbitron:wght@700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 100%; height: 100%; background: #020818; }

    #main-root {
      width: 100%; height: 100vh;
      background: linear-gradient(135deg, #020818 0%, #041040 40%, #0a2060 70%, #0d3080 100%);
      position: relative; overflow: hidden;
      font-family: 'Rajdhani', sans-serif; color: #fff;
      cursor: default; user-select: none;
    }
    .water-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(0,150,255,0.03) 60px, rgba(0,150,255,0.03) 61px),
        repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(0,180,255,0.02) 80px, rgba(0,180,255,0.02) 81px);
    }
    .scan-lines {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,30,0.15) 3px, rgba(0,0,30,0.15) 4px);
    }
    .ui-corner { position: absolute; z-index: 15; pointer-events: none; }
    .ui-corner.tl { top: 16px; left: 16px; }
    .ui-corner.tr { top: 16px; right: 16px; }
    .ui-corner.bl { bottom: 16px; left: 16px; }
    .ui-corner.br { bottom: 16px; right: 16px; }
    .date-display {
      position: absolute; top: 16px; right: 16px; z-index: 15;
      font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 3px;
      color: rgba(100,200,255,0.5); text-align: right;
    }
    .hint-text {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-size: 11px; letter-spacing: 3px; color: rgba(100,180,255,0.35);
      animation: pulse 2.5s ease-in-out infinite;
      text-transform: uppercase; z-index: 10; white-space: nowrap;
    }
    @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
    .trigger-zone {
      position: absolute; left: 0; top: 0; width: 30px; height: 100%;
      z-index: 30; cursor: pointer;
    }
  </style>
</head>
<body>
<div id="main-root">
  <div class="water-overlay"></div>
  <div class="scan-lines"></div>

  <div class="date-display" id="dateDisplay">DARK HOUR<br>00:00</div>

  <div class="ui-corner tl"><svg width="24" height="24" fill="none"><polyline points="0,24 0,0 24,0" stroke="rgba(100,200,255,0.4)" stroke-width="1.5"/></svg></div>
  <div class="ui-corner tr"><svg width="24" height="24" fill="none"><polyline points="0,0 24,0 24,24" stroke="rgba(100,200,255,0.4)" stroke-width="1.5"/></svg></div>
  <div class="ui-corner bl"><svg width="24" height="24" fill="none"><polyline points="0,24 24,24" stroke="rgba(100,200,255,0.4)" stroke-width="1.5"/><polyline points="0,0 0,24" stroke="rgba(100,200,255,0.4)" stroke-width="1.5"/></svg></div>
  <div class="ui-corner br"><svg width="24" height="24" fill="none"><polyline points="0,24 24,24 24,0" stroke="rgba(100,200,255,0.4)" stroke-width="1.5"/></svg></div>

  <canvas id="radial-canvas" style="position:absolute;inset:0;z-index:20;"></canvas>
  <div class="trigger-zone" id="triggerZone"></div>
  <div class="hint-text">Hover left edge or press Tab to open menu</div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
