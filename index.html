
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
  #p3{width:100%;height:420px;position:relative;overflow:hidden;cursor:default;user-select:none;}
  .wover{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(0,150,255,.03) 60px,rgba(0,150,255,.03) 61px),
    repeating-linear-gradient(90deg,transparent,transparent 80px,rgba(0,180,255,.02) 80px,rgba(0,180,255,.02) 81px);}
  .scanl{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,30,.15) 3px,rgba(0,0,30,.15) 4px);}
  .corner{position:absolute;z-index:15;pointer-events:none;}
  .corner.tl{top:16px;left:16px}.corner.tr{top:16px;right:16px}
  .corner.bl{bottom:16px;left:16px}.corner.br{bottom:16px;right:16px}
  #dd{position:absolute;top:16px;right:16px;z-index:15;font-family:'Orbitron',sans-serif;
    font-size:11px;letter-spacing:3px;color:rgba(100,200,255,.5);text-align:right;}
  #hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:3px;color:rgba(100,180,255,.35);
    animation:pulse 2.5s ease-in-out infinite;text-transform:uppercase;z-index:10;white-space:nowrap;
    font-family:'Orbitron',sans-serif;}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .tz{position:absolute;left:0;top:0;width:30px;height:100%;z-index:30;cursor:pointer;}
</style>
<div id="p3">
  <div class="wover"></div><div class="scanl"></div>
  <div id="dd">DARK HOUR<br>00:00</div>
  <div class="corner tl"><svg width="24" height="24" fill="none"><polyline points="0,24 0,0 24,0" stroke="rgba(100,200,255,.4)" stroke-width="1.5"/></svg></div>
  <div class="corner tr"><svg width="24" height="24" fill="none"><polyline points="0,0 24,0 24,24" stroke="rgba(100,200,255,.4)" stroke-width="1.5"/></svg></div>
  <div class="corner bl"><svg width="24" height="24" fill="none"><polyline points="0,24 24,24" stroke="rgba(100,200,255,.4)" stroke-width="1.5"/><polyline points="0,0 0,24" stroke="rgba(100,200,255,.4)" stroke-width="1.5"/></svg></div>
  <div class="corner br"><svg width="24" height="24" fill="none"><polyline points="0,24 24,24 24,0" stroke="rgba(100,200,255,.4)" stroke-width="1.5"/></svg></div>
  <canvas id="mc" style="position:absolute;inset:0;z-index:20;"></canvas>
  <div class="tz" id="tz"></div>
  <div id="hint">Hover left edge or press Tab</div>
</div>
<script>
(function(){
  const root=document.getElementById('p3'),canvas=document.getElementById('mc'),ctx=canvas.getContext('2d'),tz=document.getElementById('tz');
  const ITEMS=['PORTFOLIO','ABOUT','CONTACT'],COUNT=ITEMS.length;
  const HUB_R=52,SEG_INNER=14,SEG_OUTER=150,ANGLE_SPREAD=80,GAP_DEG=5;
  const SEG_DEG=(ANGLE_SPREAD/COUNT)-GAP_DEG;
  let menuOpen=false,progress=0,targetProgress=0,activeIdx=0,rafId=null,canToggle=true;
  let shatterProgress=0,shatterTarget=0,shatterRaf=null,loopRaf=null;

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  function easeOut(t){return 1-Math.pow(1-t,3);}
  function polar(hub,r,a){return{x:hub.x+r*Math.cos(a),y:hub.y+r*Math.sin(a)};}
  function getHub(){return{x:-HUB_R+18,y:root.offsetHeight/2};}
  function itemAngle(i){const s=-ANGLE_SPREAD/2,step=ANGLE_SPREAD/COUNT;return(s+step*i+step/2)*Math.PI/180;}

  function buildShard(i){
    const rng=mulberry32(i*9999+1234),angle=itemAngle(i),hs=(SEG_DEG/2)*Math.PI/180;
    const a1=angle-hs,a2=angle+hs,pts=[],rI=HUB_R+SEG_INNER,rO=rI+SEG_OUTER;
    for(let s=0;s<=4;s++){const t=s/4,r=rI+(rO-rI)*t;pts.push({r:r+(rng()-.5)*18,a:a1+(rng()-.5)*.06});}
    for(let s=0;s<=6;s++){const t=s/6,a=a1+(a2-a1)*t;pts.push({r:rO+(rng()-.5)*22,a:a+(rng()-.5)*.04});}
    for(let s=0;s<=4;s++){const t=s/4,r=rO+(rI-rO)*t;pts.push({r:r+(rng()-.5)*18,a:a2+(rng()-.5)*.06});}
    for(let s=0;s<=6;s++){const t=s/6,a=a2+(a1-a2)*t;pts.push({r:rI+(rng()-.5)*12,a:a+(rng()-.5)*.04});}
    const hlPts=[{r:rI+6,a:a1+.01},{r:rI+32+rng()*16,a:a1+.01},{r:rI+18+rng()*12,a:a1+(a2-a1)*.35},{r:rI+7,a:a1+(a2-a1)*.3}];
    const crackPts=[{r:rI+(rO-rI)*.3+(rng()-.5)*10,a:angle+(rng()-.5)*hs*.6},{r:rI+(rO-rI)*.7+(rng()-.5)*10,a:angle+(rng()-.5)*hs*.4},{r:rO-rng()*20,a:angle+(rng()-.5)*hs*.8}];
    return{pts,hlPts,crackPts};
  }
  const SHARDS=ITEMS.map((_,i)=>buildShard(i));

  function seededRng(seed){let s=seed;return function(){s=Math.imul(s^s>>>15,1|s);s^=s+Math.imul(s^s>>>7,61|s);return((s^s>>>14)>>>0)/4294967296;};}
  const BG_PIECES=(()=>{
    const rng=seededRng(42);
    const polys=[
      [{x:0,y:0},{x:95,y:0},{x:80,y:35},{x:110,y:60},{x:60,y:90},{x:0,y:70}],
      [{x:95,y:0},{x:220,y:0},{x:220,y:55},{x:170,y:40},{x:110,y:60},{x:80,y:35}],
      [{x:0,y:70},{x:60,y:90},{x:45,y:140},{x:80,y:170},{x:30,y:200},{x:0,y:190}],
      [{x:60,y:90},{x:110,y:60},{x:170,y:40},{x:220,y:55},{x:220,y:170},{x:160,y:150},{x:120,y:180},{x:80,y:170},{x:45,y:140}],
      [{x:0,y:190},{x:30,y:200},{x:80,y:170},{x:120,y:180},{x:100,y:240},{x:50,y:270},{x:0,y:260}],
      [{x:120,y:180},{x:160,y:150},{x:220,y:170},{x:220,y:290},{x:175,y:275},{x:130,y:300},{x:100,y:240}],
      [{x:0,y:260},{x:50,y:270},{x:100,y:240},{x:130,y:300},{x:90,y:340},{x:40,y:360},{x:0,y:350}],
      [{x:130,y:300},{x:175,y:275},{x:220,y:290},{x:220,y:420},{x:160,y:420},{x:110,y:390},{x:90,y:340}],
      [{x:0,y:350},{x:40,y:360},{x:90,y:340},{x:110,y:390},{x:60,y:420},{x:0,y:420}],
    ];
    return polys.map(poly=>{
      let cx=0,cy=0;poly.forEach(p=>{cx+=p.x;cy+=p.y;});cx/=poly.length;cy/=poly.length;
      const hx=-34,hy=210,dx=cx-hx,dy=cy-hy,dist=Math.sqrt(dx*dx+dy*dy)||1,speed=120+rng()*180;
      return{poly,cx,cy,vx:(dx/dist)*speed+(rng()-.5)*60,vy:(dy/dist)*speed+(rng()-.5)*80,vr:(rng()-.5)*140,delay:rng()*.25};
    });
  })();

  const WLINES=Array.from({length:14},()=>({angle:Math.random()*Math.PI*2,r:10+Math.random()*160,len:25+Math.random()*90,w:Math.random()>.5?1+Math.random()*5:.6,alpha:.06+Math.random()*.14,va:(Math.random()-.5)*.009,vr:(Math.random()-.5)*.5}));
  function tickLines(){WLINES.forEach(l=>{l.angle+=l.va;l.r+=l.vr;if(l.r<0)l.r=170;if(l.r>180)l.r=5;});}

  function drawPoly(hub,pts,ep,fill,stroke,lw){
    if(pts.length<3)return;
    const rI=HUB_R+SEG_INNER,sp=pts.map(p=>{const sr=rI+(p.r-rI)*ep;return polar(hub,sr,p.a);});
    ctx.beginPath();ctx.moveTo(sp[0].x,sp[0].y);for(let k=1;k<sp.length;k++)ctx.lineTo(sp[k].x,sp[k].y);
    ctx.closePath();ctx.fillStyle=fill;ctx.fill();
    if(lw>0){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
  }

  function drawWhiteArea(hub,sp){
    const fanA=(ANGLE_SPREAD+28)*Math.PI/180,fanR=220;
    ctx.save();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(hub.x,hub.y);ctx.arc(hub.x,hub.y,fanR,-fanA/2,fanA/2);ctx.closePath();ctx.fill();
    ctx.save();ctx.beginPath();ctx.moveTo(hub.x,hub.y);ctx.arc(hub.x,hub.y,fanR,-fanA/2,fanA/2);ctx.closePath();ctx.clip();
    WLINES.forEach(l=>{const px=hub.x+l.r*Math.cos(l.angle),py=hub.y+l.r*Math.sin(l.angle);ctx.save();ctx.globalAlpha=l.alpha*sp;ctx.fillStyle='#000';ctx.translate(px,py);ctx.rotate(l.angle);ctx.fillRect(0,-l.w/2,l.len,l.w);ctx.restore();});
    ctx.globalAlpha=.035*sp;ctx.strokeStyle='#000';ctx.lineWidth=.4;
    for(let a=-fanA/2;a<fanA/2;a+=Math.PI/20){ctx.beginPath();ctx.moveTo(hub.x,hub.y);ctx.lineTo(hub.x+fanR*Math.cos(a),hub.y+fanR*Math.sin(a));ctx.stroke();}
    for(let r=20;r<fanR;r+=18){ctx.beginPath();ctx.arc(hub.x,hub.y,r,-fanA/2,fanA/2);ctx.stroke();}
    ctx.restore();ctx.restore();
  }

  function drawBgLayer(hub,sp){
    BG_PIECES.forEach(piece=>{
      const ep=easeOut(Math.max(0,Math.min(1,(sp-piece.delay)/.8)));
      ctx.save();ctx.translate(piece.vx*ep,piece.vy*ep);
      ctx.translate(piece.cx,piece.cy);ctx.rotate(piece.vr*ep*Math.PI/180);
      ctx.translate(-piece.cx,-piece.cy);
      ctx.beginPath();piece.poly.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):
      ctx.lineTo(p.x,p.y));ctx.closePath();
      const grd=ctx.createLinearGradient(0,0,220,canvas.height);

      grd.addColorStop(0,'#020818');
      grd.addColorStop(.5,'#020818');
      grd.addColorStop(1,'#020818');

      ctx.fillStyle=grd;ctx.fill();
      ctx.strokeStyle=`rgba(80,160,255,${.4*(1-ep*.7)})`;
      ctx.lineWidth=1;ctx.stroke();ctx.restore();
    });
  }

  function drawHub(hub,ep){
    ctx.save();ctx.globalAlpha=Math.min(1,ep*1.5);
    ctx.beginPath();ctx.arc(hub.x,hub.y,HUB_R,0,Math.PI*2);ctx.strokeStyle='rgba(80,180,255,.5)';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.arc(hub.x,hub.y,HUB_R-4,0,Math.PI*2);ctx.fillStyle='rgba(0,30,90,.7)';ctx.fill();
    ctx.beginPath();ctx.arc(hub.x,hub.y,4,0,Math.PI*2);ctx.fillStyle='rgba(100,200,255,.8)';ctx.fill();
    for(let t=0;t<12;t++){const ta=(t/12)*Math.PI*2;ctx.beginPath();ctx.moveTo(hub.x+(HUB_R-10)*Math.cos(ta),hub.y+(HUB_R-10)*Math.sin(ta));ctx.lineTo(hub.x+(HUB_R-4)*Math.cos(ta),hub.y+(HUB_R-4)*Math.sin(ta));ctx.strokeStyle='rgba(100,200,255,.3)';ctx.lineWidth=1;ctx.stroke();}
    ctx.restore();
  }

  function drawMenuShards(hub,ep){
    ITEMS.forEach((label,i)=>{
      const isActive=i===activeIdx,sh=SHARDS[i],angle=itemAngle(i),rI=HUB_R+SEG_INNER,rO=rI+SEG_OUTER*ep;
      ctx.save();
      drawPoly(hub,sh.pts,ep,isActive?`rgba(160,50,0,${.72+ep*.15})`:`rgba(0,40,120,${.62+ep*.1})`,isActive?'rgba(255,130,60,.9)':'rgba(70,170,255,.55)',isActive?2:1);
      ctx.globalAlpha=ep*(isActive?.6:.32);drawPoly(hub,sh.hlPts,ep,isActive?'rgba(255,220,180,.65)':'rgba(180,230,255,.55)','',0);
      ctx.globalAlpha=ep*.25;const cs=sh.crackPts.map(p=>polar(hub,rI+(p.r-rI)*ep,p.a));
      if(cs.length>=2){ctx.beginPath();ctx.moveTo(cs[0].x,cs[0].y);for(let k=1;k<cs.length;k++)ctx.lineTo(cs[k].x,cs[k].y);ctx.strokeStyle=isActive?'rgba(255,200,160,.5)':'rgba(140,200,255,.4)';ctx.lineWidth=.8;ctx.stroke();}
      ctx.restore();
      if(ep>.4){const la=Math.min(1,(ep-.4)/.3),midR=rI+(rO-rI)*.5;ctx.save();ctx.globalAlpha=la;ctx.font=`700 ${isActive?14:12}px Orbitron,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=isActive?'#fff':'rgba(160,220,255,.9)';if(isActive){ctx.shadowColor='rgba(255,140,60,.9)';ctx.shadowBlur=12;}ctx.fillText(label,hub.x+midR*Math.cos(angle),hub.y+midR*Math.sin(angle));ctx.restore();}
      if(isActive&&ep>.75){const aa=(ep-.75)/.25;ctx.save();ctx.globalAlpha=aa;ctx.fillStyle='#ff9060';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('▶',hub.x+(rO+14)*Math.cos(angle),hub.y+(rO+14)*Math.sin(angle));ctx.restore();}
    });
  }

  function drawFrame(){
    const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);
    const hub=getHub(),menuEp=ease(progress),shatEp=ease(shatterProgress);
    const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#020818');bg.addColorStop(.4,'#041040');bg.addColorStop(.7,'#0a2060');bg.addColorStop(1,'#0d3080');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    if(shatterProgress>0){tickLines();drawWhiteArea(hub,shatEp);drawBgLayer(hub,shatEp);}
    if(menuEp>0)drawHub(hub,menuEp);
    if(progress>.005)drawMenuShards(hub,menuEp);
  }

  function animMenu(){const diff=targetProgress-progress;if(Math.abs(diff)<.004){progress=targetProgress;drawFrame();rafId=null;return;}progress+=diff*.18;drawFrame();rafId=requestAnimationFrame(animMenu);}
  function startMenuAnim(){if(rafId)cancelAnimationFrame(rafId);rafId=requestAnimationFrame(animMenu);}

  function animShatter(){
    const diff=shatterTarget-shatterProgress;
    if(Math.abs(diff)<.004){shatterProgress=shatterTarget;if(shatterProgress>.5)loopRaf=requestAnimationFrame(loopDraw);else drawFrame();shatterRaf=null;return;}
    shatterProgress+=diff*.1;drawFrame();shatterRaf=requestAnimationFrame(animShatter);
  }
  function loopDraw(){drawFrame();if(menuOpen)loopRaf=requestAnimationFrame(loopDraw);}
  function startShatterAnim(){if(shatterRaf)cancelAnimationFrame(shatterRaf);if(loopRaf){cancelAnimationFrame(loopRaf);loopRaf=null;}shatterRaf=requestAnimationFrame(animShatter);}

  function resize(){canvas.width=root.offsetWidth;canvas.height=root.offsetHeight;drawFrame();}

  function openMenu(){
    if(menuOpen||!canToggle)return;menuOpen=true;canToggle=false;
    shatterTarget=1;startShatterAnim();
    setTimeout(()=>{targetProgress=1;startMenuAnim();canToggle=true;},300);
  }
  function closeMenu(){
    if(!menuOpen||!canToggle)return;menuOpen=false;canToggle=false;
    if(loopRaf){cancelAnimationFrame(loopRaf);loopRaf=null;}
    shatterTarget=0;startShatterAnim();targetProgress=0;startMenuAnim();
    setTimeout(()=>{canToggle=true;},600);
  }
  function toggleMenu(){menuOpen?closeMenu():openMenu();}

  function hitTest(mx,my){
    const hub=getHub(),ep=ease(progress),rI=HUB_R+SEG_INNER,rO=rI+SEG_OUTER*ep;
    const dx=mx-hub.x,dy=my-hub.y,r=Math.sqrt(dx*dx+dy*dy);
    if(r<rI-10||r>rO+15)return -1;
    const angle=Math.atan2(dy,dx),halfSeg=((SEG_DEG/2)+1)*Math.PI/180;
    for(let i=0;i<COUNT;i++){let d=angle-itemAngle(i);while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;if(Math.abs(d)<=halfSeg)return i;}
    return -1;
  }

  root.addEventListener('mousemove',e=>{
    const rect=root.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
    if(mx<40&&!menuOpen)openMenu();
    if(menuOpen){const hit=hitTest(mx,my);if(hit>=0&&hit!==activeIdx){activeIdx=hit;drawFrame();}if(mx>HUB_R+SEG_INNER+SEG_OUTER+70)closeMenu();}
  });
  root.addEventListener('mouseleave',()=>{if(menuOpen)closeMenu();});
  canvas.style.pointerEvents='auto';
  canvas.addEventListener('click',e=>{if(!menuOpen)return;const rect=root.getBoundingClientRect(),hit=hitTest(e.clientX-rect.left,e.clientY-rect.top);if(hit>=0){activeIdx=hit;drawFrame();}});
  tz.addEventListener('click',toggleMenu);
  document.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();toggleMenu();}
    if(menuOpen){if(e.key==='ArrowDown'||e.key==='ArrowRight'){activeIdx=(activeIdx+1)%COUNT;drawFrame();}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){activeIdx=(activeIdx-1+COUNT)%COUNT;drawFrame();}if(e.key==='Escape')closeMenu();}
  });
  new ResizeObserver(resize).observe(root);resize();
  const now=new Date();document.getElementById('dd').innerHTML=`DARK HOUR<br>${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
})();
</script>
